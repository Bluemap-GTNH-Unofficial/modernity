[project]
name = "bmgtnh-modernity"
version = "0.1.0"
description = "Builds optional Modernity-GTNH BlueMap resource packs (modded textures via the GTNH client exporter, vanilla textures via a 1.7.10 -> 1.13 rename table) from a user-supplied Modernity release."
requires-python = ">=3.12"
dependencies = [
    "pillow>=11",
]

[project.scripts]
modernity = "modernity.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modernity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
